services:
  # 🗄️ Serviço do Banco de Dados PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: estudoos-postgres
    restart: always
    environment:
      POSTGRES_DB: estudoos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      TZ: America/Maceio
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ☕ Serviço da API Java Spring Boot
  api-java:
    build: .
    container_name: estudoos-api
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://estudoos-postgres:5432/estudoos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TZ: America/Maceio
      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Maceio" # 👈 Força a JVM do Java a rodar estritamente no fuso do Brasil
      GEMINI_API_KEY: "AQ.Ab8RN6KofRlHJqPqvYaUOrDxjDNhbGpoSWYNfmcQWCLCOOUESg" # 🔑 Chave da IA integrada
    depends_on:
      - postgres-db

volumes:
  postgres_data:
